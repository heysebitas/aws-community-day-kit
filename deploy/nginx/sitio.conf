# Ejemplo de proxy inverso. Cambia el dominio, el puerto y los certificados.
#
# Con este archivo hay UN proxy delante de Next, que es lo que el kit asume por
# omisión (PROXIES_DE_CONFIANZA=1). Si además hay un CDN, ver docs/seguridad.md.

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com www.tu-dominio.com;

    ssl_certificate     /etc/ssl/tu-dominio.com.pem;
    ssl_certificate_key /etc/ssl/tu-dominio.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Algunas subidas del panel pasan por el servidor; el límite por omisión
    # de nginx es 1 MB y respondería 413.
    client_max_body_size 55M;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
