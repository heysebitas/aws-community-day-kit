# Ejemplo de proxy inverso. Cambia el dominio, el puerto y los certificados.
#
# Con este archivo hay UN proxy delante de Next, que es lo que el kit asume por
# omisión (PROXIES_DE_CONFIANZA=1). Si además hay un CDN, ver docs/seguridad.md.
#
# Va dentro de `http {}` (p. ej. en /etc/nginx/conf.d/). Comprueba con `nginx -t`.

# Conexiones abiertas hacia Node: sin esto cada petición abre un TCP nuevo.
upstream app {
    server 127.0.0.1:3000;
    keepalive 16;
    # Menos que el keepAliveTimeout de Node (5 s): si Node cierra primero, nginx
    # reutilizaría un socket cerrado y respondería 502.
    keepalive_timeout 4s;
}

# `Connection: upgrade` sólo cuando el cliente lo pide; si no, vacío para que el
# keepalive funcione.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Nada con sesión pasa por la caché (vale para `__Host-cd-sesion` y `cd-sesion`).
map $http_cookie $con_sesion {
    default                  0;
    "~(^|;\s*)(__Host-)?cd-sesion=" 1;
}

# Sin la cookie de idioma, next-intl decide por Accept-Language (y puede
# redirigir): esas van siempre a Node, que deja la cookie.
map $cookie_NEXT_LOCALE $sin_idioma {
    ""      1;
    default 0;
}

# Sólo se guarda lo que Node marca como cacheable (max-age / s-maxage); nginx no
# guarda respuestas con Set-Cookie ni con `private` o `no-store`.
proxy_cache_path /var/cache/nginx/evento levels=1:2 keys_zone=evento:10m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    # Desde nginx 1.25.1 se escribe `listen 443 ssl;` + `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com www.tu-dominio.com;

    ssl_certificate     /etc/ssl/tu-dominio.com.pem;
    ssl_certificate_key /etc/ssl/tu-dominio.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Algunas subidas del panel pasan por el servidor; el límite por omisión
    # de nginx es 1 MB y respondería 413.
    client_max_body_size 55M;

    # Node ya comprime (gzip) salvo con COMPRIMIR_EN_PROXY=1; nginx no vuelve a
    # comprimir lo que llega comprimido. Ver docs/despliegue.md.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml text/x-component;
    # brotli no viene en el nginx de Debian/Ubuntu ni en la imagen oficial: hace
    # falta el módulo ngx_brotli (paquete libnginx-mod-http-brotli-*). Con él:
    #   brotli on; brotli_comp_level 5; brotli_types <los mismos de gzip_types>;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;

    # Con hash en el nombre: no cambian nunca.
    location /_next/static/ {
        proxy_pass http://app;
        proxy_cache evento;
        proxy_cache_valid 200 365d;
    }

    location /_next/image {
        proxy_pass http://app;
        proxy_cache evento;
    }

    # El panel y la sesión, sin caché.
    location ~ "^/(api/(admin|auth)|([a-z]{2}/)?admin)(/|$)" {
        proxy_pass http://app;
    }

    # La API pública: marca, og, agenda… con la Cache-Control que manda Node.
    location /api/ {
        proxy_pass http://app;
        proxy_cache evento;
        proxy_cache_bypass $con_sesion;
        proxy_no_cache $con_sesion;
    }

    # Las páginas: ISR con s-maxage. La clave lleva el idioma de la cookie.
    location / {
        proxy_pass http://app;
        proxy_cache evento;
        proxy_cache_key $scheme$host$request_uri|$cookie_NEXT_LOCALE;
        proxy_cache_bypass $con_sesion $sin_idioma;
        proxy_no_cache $con_sesion $sin_idioma;
    }
}
