# Ejemplo: despliegue por SSH a un servidor propio en cada push a main.
#
# Para usarlo, cópialo a .github/workflows/ y crea los secretos VPS_HOST,
# VPS_USER, VPS_SSH_KEY y VPS_PORT en tu repositorio. Cambia la ruta y el
# nombre del proceso para que coincidan con deploy/pm2/ecosystem.config.cjs.

name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            # Una sesión SSH sin terminal no carga el perfil: el PATH se fija a mano.
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            cd /srv/mi-evento

            git fetch --all
            git reset --hard origin/main

            # Las NEXT_PUBLIC_* quedan escritas en el build: .env.local va antes.
            test -f .env.local || { echo "Falta .env.local"; exit 1; }

            # --include=dev: el build necesita typescript y tailwind aunque
            # NODE_ENV=production esté exportado.
            npm ci --include=dev
            npm run build

            pm2 startOrReload deploy/pm2/ecosystem.config.cjs --update-env
            pm2 save
