version: 2
updates:
  # Un solo PR al mes por ecosistema: cada PR gasta una ejecución de la CI.
  # Los saltos de versión mayor vienen en el mismo PR y no se mergean sin probarlos.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      dependencias:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      acciones:
        patterns: ["*"]
